version: '3.8'

services:
  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data 
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/database.db  
      - SECRET_KEY=1234
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
